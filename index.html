// ---- Scaling engine
const FR={.25:"¼",.5:"½",.75:"¾"};
function frac(v){const w=Math.floor(v),f=v-w;return (w?w:"")+(FR[f]||"")||"¼"}
function amt(i,n,base){
 if(i.a==null)return i.u;
 let f=n/base;
 if(i.s=="s"&&f!=1)f=f>1?1+(f-1)*.75:1-(1-f)*.75;
 let v=i.a*f,u=i.u,out;
 if(u=="g"){const r=v<100?5:v<500?10:25;v=Math.max(r,Math.round(v/r)*r);out=v>=1000?(+(v/1000).toFixed(2))+" kg":v+" g"}
 else if(u=="ml"){const r=v<100?5:v<500?25:50;v=Math.max(r,Math.round(v/r)*r);out=v>=1000?(+(v/1000).toFixed(2))+" l":v+" ml"}
 else if(u=="tsp"||u=="tbsp"){v=Math.max(.25,Math.round(v*4)/4);out=frac(v)+" "+u}
 else{const half=i.a%1!=0;v=half?Math.max(.5,Math.round(v*2)/2):Math.max(1,Math.round(v));out=(v%1?frac(v):v)+(u=="pc"?"":" "+u)}
 return (i.e||i.s=="s"?"~":"")+out;
}

const ICO=[[/water/,"💧"],[/chicken/,"🍗"],[/butter/,"🧈"],[/garlic/,"🧄"],[/bay/,"🍃"],[/rosemary|thyme|parsley/,"🌿"],[/wine/,"🍷"],[/honey/,"🍯"],[/paprika|chilli|cayenne|cajun/,"🌶️"],[/stock/,"🥣"],[/onion/,"🧅"],[/potato/,"🥔"],[/cauliflower/,"🥦"],[/parsnip|carrot/,"🥕"],[/seeds|turmeric/,"🌾"],[/egg/,"🥚"],[/oil/,"🫒"],[/pork|beef|veal|mince/,"🥩"],[/bread/,"🍞"],[/shiitake|mushroom/,"🍄"],[/lentil/,"🫘"],[/leek/,"🥬"],[/lemon/,"🍋"],[/parmesan|cream/,"🧀"],[/tomato/,"🍅"],[/tikka/,"🍛"],[/capsicum/,"🫑"],[/courgette/,"🥒"],[/pasta|rigatoni/,"🍝"],[/pepper|salt/,"🧂"]];
const ico=s=>{const m=ICO.find(x=>x[0].test(s.toLowerCase()));return m?m[1]:"🍽️"};

const fill=(t,r)=>t.replace(/\{(\w+)\}/g,(m,k)=>{const i=r.ing.find(x=>x.id==k);return i?`<b>${amt(i,n,r.base)} ${i.n}</b>`:m});
const hm=m=>m>=60?Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":""):m+" min";
function groups(a,k){const o=[];a.forEach(x=>{const g=k(x);let e=o.find(y=>y[0]==g);if(!e)o.push(e=[g,[]]);e[1].push(x)});return o}

 const big=n>r.base*1.5;
 $("#app").innerHTML=`<div class="hero"><div><h1>${r.title}</h1><p class="sub">${r.sub}</p>
 <div class="chips"><span class="chip">Hands-on ${hm(r.active)}</span><span class="chip">Total ${hm(r.total)}</span><span class="chip">Written for ${r.base} people</span></div>
 <div class="por"><b>Cooking for</b>${[2,4,6,8,10].map(p=>`<button class="pb" aria-pressed="${p==n}" data-p="${p}" aria-label="${p} people">${p}</button>`).join("")}</div>
 <button class="go" id="gocook">Start cooking</button></div>

 ${big?`<p class="note">Bigger batch: use a larger pot and wider pans, and roast or bake in batches. Times stay the same, but heating up takes longer.</p>`:""}

 <div><h2>Method</h2>${groups(r.st,x=>x[0]).map(([g,l],gi)=>`<h3 class="c${gi%5}">${g}</h3><ol class="st">${l.map(s=>`<li>${fill(s[1],r)}${s[2]?`<span class="tm">${s[2]} min</span>`:""}</li>`).join("")}</ol>`).join("")}</div></div>`;
}
document.addEventListener("click",e=>{

// ---- Cook mode
let si=0,tid=null,wl=null;
function cookOpen(){si=0;$("#cook").classList.add("on");try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{})}catch(_){}cook()}
function cookClose(){clearInterval(tid);$("#cook").classList.remove("on");try{wl&&wl.release()}catch(_){}}
function cook(){
 const r=R[cur],s=r.st[si];clearInterval(tid);
 $("#cook").innerHTML=`<div class="top"><span>Step ${si+1} of ${r.st.length} · for ${n} people</span><button class="x" id="cx">Close</button></div>
 <div class="body"><div class="g">${s[0]}</div><div class="tx">${fill(s[1],r)}</div>${s[2]?`<button class="tbtn" id="tb">Start ${s[2]} min timer</button>`:""}</div>
 <div class="nav"><button id="pv" ${si?"":"disabled"}>Back</button><button class="nx" id="nx">${si==r.st.length-1?"Done":"Next step"}</button></div>`;
 $("#cx").onclick=cookClose;$("#pv").onclick=()=>{si--;cook()};
 $("#nx").onclick=()=>{si==r.st.length-1?cookClose():(si++,cook())};
 const tb=$("#tb");if(tb)tb.onclick=()=>{let left=s[2]*60;const up=()=>{tb.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")+" left"};up();
  tid=setInterval(()=>{left--;if(left<=0){clearInterval(tid);tb.textContent="Time is up";try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(_){}}else up()},1000)};
}

 ${big?`<p class="note">Bigger batch: use a larger pot and wider pans, and cook in batches. Times stay the same, but heating up takes longer.</p>`:""}
